<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vistoria Elétrica Básica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vistoria">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Plano: ferramenta de campo para uma mão só. Cinza-azulado de quadro elétrico, âmbar de placa de advertência.
   Layout: cabeçalho fino com progresso, conteúdo em cartões, navegação no polegar (rodapé) no celular e trilho lateral no computador. */
:root{
  --bg:#EDF0F3; --panel:#FFFFFF; --ink:#121A21; --muted:#56626F; --line:#D3D9DF; --soft:#F4F6F8;
  --accent:#C27A00; --accent-ink:#7A4A00; --accent-soft:#FBEFD9;
  --ok:#23784A; --ok-soft:#E0F2E7; --warn:#9A6200; --warn-soft:#FBF0D3; --crit:#B3261E; --crit-soft:#FBE3E0; --na:#6E7A86; --na-soft:#E8ECEF;
  --f-display:"Roboto Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:12px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --panel:#182027; --ink:#E6EBEF; --muted:#9AA6B1; --line:#2B353F; --soft:#1E2730;
    --accent:#F0A640; --accent-ink:#F6C27A; --accent-soft:#33291A;
    --ok:#5BC98A; --ok-soft:#163023; --warn:#E9B44C; --warn-soft:#322914; --crit:#F2786A; --crit-soft:#3A1E1B; --na:#8C98A3; --na-soft:#222B33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --panel:#182027; --ink:#E6EBEF; --muted:#9AA6B1; --line:#2B353F; --soft:#1E2730;
  --accent:#F0A640; --accent-ink:#F6C27A; --accent-soft:#33291A;
  --ok:#5BC98A; --ok-soft:#163023; --warn:#E9B44C; --warn-soft:#322914; --crit:#F2786A; --crit-soft:#3A1E1B; --na:#8C98A3; --na-soft:#222B33;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:20px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* cabeçalho */
.hd{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.drv{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:12.5px;font-weight:600;padding:4px 10px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap;color:var(--ink)}
.drv[hidden]{display:none}
.drv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drv.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.drv.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.drv.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.hd-t{display:grid;text-align:left;border:0;background:none;padding:2px 0 6px;min-width:0;cursor:pointer}
.hd-title{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-title::after{content:" ▾";color:var(--muted);font-size:13px}
.hd-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.hd-sub .err{color:var(--crit)}
.net{display:inline-flex;align-items:center;gap:4px}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--na)}
.net.ok::before{background:var(--ok)} .net.warn::before{background:var(--warn)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center}
.prog{grid-column:1/-1;height:4px;background:var(--soft);margin:0 -12px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

main{max-width:760px;margin:0 auto;padding:14px 12px;display:grid;gap:14px}

/* navegação */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bn button{border:0;background:none;height:var(--nav-h);display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
.bn button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn button[aria-current="true"]{color:var(--ink);font-weight:600}
.bn button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.bn .bdg{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;line-height:18px;background:var(--crit);color:#fff}
.bn .bdg.warn{background:var(--warn)}
@media (min-width:900px){
  body{padding-bottom:24px;padding-left:96px}
  .bn{top:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:76px;align-content:start;padding-top:80px;border-top:0;border-right:1px solid var(--line)}
  .bn button{height:76px}
  .bn button[aria-current="true"]::before{top:18%;bottom:18%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .hd{padding-left:24px} main{padding:20px 24px}
}

/* botão de câmera flutuante e folha de ações */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:24;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:#1A1200;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px;stroke:#1A1200;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab[hidden]{display:none}
@media (min-width:900px){.fab{bottom:24px;right:24px}}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 6px}
.sheet button{min-height:54px;border:1px solid var(--line);background:var(--soft);border-radius:10px;text-align:left;padding:8px 14px;font-weight:600;cursor:pointer}
.sheet button small{display:block;font-weight:400;color:var(--muted);font-size:13px}

/* blocos */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lead{color:var(--muted);font-size:14px;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.g4{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.g2.st{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:46px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px}
textarea{min-height:52px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.num input{font-family:var(--f-mono);font-size:18px;text-align:center;padding:8px 4px}
.btn{min-height:46px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1A1200}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.status{font-size:13px;color:var(--muted)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;text-align:center}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-soft);border-left:4px solid var(--warn)}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
details.card > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:17px}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"▾";color:var(--muted)}
details.card[open] > summary::after{content:"▴"}
details.card > summary small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-left:auto}
.notdone{margin:0;padding-left:18px;font-size:14px;display:grid;gap:2px}
.notdone li::marker{color:var(--crit)}
.scope{background:var(--soft);border-radius:10px;padding:12px;font-size:14px;margin:0}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.na{background:var(--na-soft);color:var(--muted)}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;min-height:46px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}

/* inspeção */
.et{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.et-h{width:100%;border:0;background:none;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:14px;text-align:left;cursor:pointer;min-height:58px}
.et-h .n{font-family:var(--f-mono);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.et.done .et-h .n{background:var(--ok-soft);color:var(--ok)}
.et-h .tt{font-family:var(--f-display);font-weight:600;font-size:16.5px}
.et-h .cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.et-h .chev{color:var(--muted);transition:transform .2s}
.et[data-open="true"] .et-h .chev{transform:rotate(180deg)}
.et-b{display:none;border-top:1px solid var(--line)}
.et[data-open="true"] .et-b{display:block}
.et-off{padding:4px 14px 12px}
.qd{border-bottom:1px solid var(--line)}
.qd-lead{padding:10px 14px 0;margin:0}
.qd-h{width:100%;border:0;background:var(--soft);display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 14px;text-align:left;cursor:pointer;min-height:52px;color:var(--ink);font:inherit}
.qd-h .n{font-family:var(--f-mono);font-size:12px;padding:3px 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.qd.done .qd-h .n{background:var(--ok-soft);color:var(--ok)}
.qd-h .tt{font-family:var(--f-display);font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qd-h .cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qd-h .chev{color:var(--muted);transition:transform .2s}
.qd[data-open="true"] .qd-h .chev{transform:rotate(180deg)}
.qd[data-open="true"] .qd-h{border-bottom:1px solid var(--line)}
.qd-b{border-left:4px solid var(--accent-soft)}
.qd-nome{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-bottom:1px solid var(--line)}
.qd-nome label{flex:1}
.qd-add{padding:12px 14px}
.qd-med{padding:12px 14px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.qd-med .lead{margin:0}
#secCor .mc{margin-bottom:8px}
.qd-add .btn{width:100%}

.it{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px;border-left:5px solid transparent}
.it:last-child{border-bottom:0}
.it[data-s="C"]{border-left-color:var(--ok)} .it[data-s="NC"]{border-left-color:var(--crit);background:linear-gradient(90deg,var(--crit-soft),transparent 40%)} .it[data-s="NA"],.it[data-s="NV"]{border-left-color:var(--na)}
.it-t{font-size:15px}
.it .mc{border-radius:10px}
#secTermo .mc{margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px;background:var(--na-soft);color:var(--muted)}
.tag.T{background:var(--accent-soft);color:var(--accent-ink)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg4 button{min-height:48px;border:1px solid var(--line);background:var(--soft);border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg4 button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg4 button[aria-pressed="true"][data-v="C"]{background:var(--ok)}
.seg4 button[aria-pressed="true"][data-v="NC"]{background:var(--crit)}
.seg4 button[aria-pressed="true"][data-v="NA"],.seg4 button[aria-pressed="true"][data-v="NV"]{background:var(--na)}
.it-x{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.mini.has{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.mini input{display:none}
.mini svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.strip:empty{display:none}
.th{flex:0 0 auto;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--soft);cursor:zoom-in;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .lbl{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:1px 4px}
.legend{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend b{color:var(--ink)}

/* notas */
.nota{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--soft)}
.nota .when{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* cartões de medição e termografia */
.mc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;border-left:5px solid var(--line)}
.mc[data-sev="ok"]{border-left-color:var(--ok)} .mc[data-sev="warn"]{border-left-color:var(--warn)} .mc[data-sev="crit"]{border-left-color:var(--crit)}
.mc-h{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:grid;gap:4px;cursor:pointer}
.mc-h .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.mc-h .l2{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mc-b{display:none;padding:0 14px 14px;gap:10px}
.mc[data-open="true"] .mc-b{display:grid}
.res{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{aspect-ratio:4/3;border-radius:10px;border:2px dashed var(--line);background:var(--soft);display:grid;place-items:center;text-align:center;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;padding:0}
.slot input{display:none}
.slot svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8}
.slot.has{border-style:solid;cursor:zoom-in}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg2 button{min-height:46px;border:0;background:var(--soft);cursor:pointer;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.passo{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14.5px;margin-top:6px}
.passo b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1A1200;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-s{min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip-s.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.resultado{display:grid;gap:6px}
.res-box{display:flex;gap:14px;align-items:center;border-radius:12px;padding:12px 14px;background:var(--na-soft)}
.res-box.ok{background:var(--ok-soft)} .res-box.warn{background:var(--warn-soft)} .res-box.crit{background:var(--crit-soft)}
.res-box .res-dt{font-size:26px;font-weight:700;white-space:nowrap}
.res-box.ok .res-dt,.res-box.ok b{color:var(--ok)} .res-box.warn .res-dt,.res-box.warn b{color:var(--warn)} .res-box.crit .res-dt,.res-box.crit b{color:var(--crit)}
.res-box span{font-size:13.5px;color:var(--ink)}
.res-vazio{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--muted)}
details.como summary{cursor:pointer;font-weight:600;color:var(--accent-ink)}
details.como ol{padding-left:20px;margin:8px 0;display:grid;gap:4px}
table.crit{width:100%;border-collapse:collapse;font-size:13px}
table.crit th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
table.crit td{padding:6px 4px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile b{display:block;font-family:var(--f-mono);font-size:22px}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.crit b{color:var(--crit)} .tile.warn b{color:var(--warn)}
.pend{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;border-left:5px solid var(--line)}
.pend[data-c="Grave"]{border-left-color:var(--crit)} .pend[data-c="Moderada"]{border-left-color:var(--warn)} .pend[data-c="Documental"]{border-left-color:var(--na)}
.pend .src{font-size:12px;color:var(--muted)}
.pend .gp{display:grid;grid-template-columns:150px 1fr 110px;gap:8px}
@media (max-width:600px){.pend .gp{grid-template-columns:1fr 1fr}.pend .gp input[data-k="prov"]{grid-column:1/-1;order:3}}
#rep{min-height:50vh;font-size:15px}

/* visualizador de fotos */
.vw{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
.vw[hidden]{display:none}
.vw-top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;gap:8px}
.vw-top button,.vw-acts button{min-height:46px;min-width:46px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;padding:6px 14px;cursor:pointer}
.vw-stage{position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.vw-stage img{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;-webkit-user-drag:none}
.vw-bot{padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);display:grid;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.vw-cap{font-size:14px} .vw-meta{font-size:12.5px;color:#C9D1D8;font-family:var(--f-mono)}
.vw-bot input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.vw-acts{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
.vw-acts .del{color:#FF9A8F}
.vw-link{color:#F6C27A;font-weight:600}
.vw-aud{display:grid;gap:6px}
.vw-aud audio{width:100%;height:40px}
.vw-aud textarea{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;min-height:44px;font-size:14px}
.vw-aud .row button{min-height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;padding:6px 12px;cursor:pointer}
.vw-aud .st{font-size:12px;color:#C9D1D8}
.rec-top{display:flex;gap:10px;align-items:center;font-size:22px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--crit);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.rec-txt{min-height:80px;max-height:40vh;overflow:auto;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px}
.sheet .rec-stop{background:var(--crit);color:#fff;border-color:var(--crit);text-align:center}
.th .aud,.slot .aud{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 6px}
.audbox{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft)}
.audbox audio{width:100%;height:36px}
.audbox .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.vw-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#aab}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;max-width:560px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,12,16,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.db{padding:12px 14px;display:grid;gap:10px;max-height:70vh;overflow:auto}
.vrow{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.vrow.cur{border-color:var(--accent)}
.vrow .meta{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<main id="main"></main>

<nav class="bn" id="bnav" aria-label="Seções"></nav>

<button class="fab" id="fab" type="button" aria-label="Foto ou registro rápido" hidden>

</button>
<input type="file" id="fabFile" accept="image/*" capture="environment" hidden>

<div class="sheet-bg" id="sheet" hidden>

    <div class="grab"></div>
    <button type="button" data-act="fabNota">Registro de campo com foto<small>Abre a câmera; depois escreva a anotação</small></button>
    <button type="button" data-act="fabNotaTxt">Registro de campo só texto<small>Anotação livre, fora do checklist</small></button>
    <button type="button" data-act="fabGeral">Foto da vista geral<small>Fachada, placa da obra, padrão de entrada</small></button>
    <button type="button" data-act="fecharSheet" style="text-align:center">Cancelar</button>
  </div>
</div>

<div class="sheet-bg" id="recSheet" hidden style="z-index:80">
  <div class="sheet" role="dialog" aria-label="Gravando relato em áudio">
    <div class="rec-top"><span class="rec-dot" aria-hidden="true"></span><b id="recTempo" class="mono">0:00</b><span class="status">máx. 3:00</span></div>
    <div class="status" id="recAlvo"></div>
    <div class="rec-txt" id="recTxt" aria-live="polite"></div>
    <div class="g2"><button type="button" data-act="recCancel" style="text-align:center">Cancelar</button><button type="button" data-act="recStop" class="rec-stop">Parar e salvar</button></div>
  </div>
</div>

<div class="vw" id="vw" hidden role="dialog" aria-label="Visualizar foto">
  <div class="vw-top"><span id="vwCount" class="mono"></span><button type="button" id="vwClose">Fechar</button></div>
  <div class="vw-stage" id="vwStage"><img id="vwImg" alt=""><div class="vw-hint">Pinça ou toque duplo para ampliar · arraste para trocar de foto</div></div>
  <div class="vw-bot">
    <div class="vw-cap" id="vwCap"></div>
    <div class="vw-meta" id="vwMeta"></div>
    <div class="vw-meta"><span id="vwQual"></span> <a id="vwDrive" class="vw-link" target="_blank" rel="noopener" hidden>Abrir original no Drive</a></div>
    <div id="vwAud" class="vw-aud"></div>
    <input type="text" id="vwLeg" placeholder="Legenda (opcional, entra no relatório)" aria-label="Legenda da foto">
    <div class="vw-acts"><button type="button" id="vwPrev" aria-label="Foto anterior">‹</button><button type="button" id="vwShare">Compartilhar</button><button type="button" id="vwDel" class="del">Excluir</button><button type="button" id="vwNext" aria-label="Próxima foto">›</button></div>
  </div>
</div>

<dialog id="dlgList" aria-labelledby="dlgListT">
  <div class="dh"><h3 id="dlgListT">Vistorias</h3><button class="btn sm ghost" id="dlgClose" type="button">Fechar</button></div>
  <div class="db" id="dlgBody"></div>
</dialog>
<dialog id="dlgConfirm" aria-labelledby="dlgConfirmT">
  <div class="dh"><h3 id="dlgConfirmT">Confirmar</h3></div>
  <div class="db"><p id="dlgConfirmMsg" style="margin:0"></p>
    <div class="row end"><button class="btn" id="cfNo" type="button">Cancelar</button><button class="btn pri" id="cfYes" type="button">Confirmar</button></div>
  </div>
</dialog>

<script>
"use strict";
const ETAPAS = [

  {id:"2", t:"Subestação ou transformador", opc:true, pergunta:"A obra possui subestação ou transformador?", itens:[
    ["s1","V","Dados de placa do transformador (potência, tensões, nº de série) conforme projeto"],

  {id:"4", t:"Linhas elétricas", opc:false, itens:[

    ["l5","V","Circuitos de dados e telefonia separados dos de energia"]]},
  {id:"5", t:"Pontos de utilização", opc:false, itens:[
    ["p1","V","Tomadas no padrão NBR 14136 com pino terra; quantidade e posição conforme projeto"],
    ["p2","V","Circuitos exclusivos para ar-condicionado, chuveiros e equipamentos de cozinha"],
    ["p3","V","Luminárias, potência e comandos conforme projeto (salas, quadra, áreas externas)"],
    ["p4","V","Iluminação de emergência instalada e acendendo ao desligar o circuito"],
    ["p5","T","Pontos de ligação de equipamentos de maior carga sem aquecimento anormal"]]},
  {id:"6", t:"Aterramento e equipotencialização (visual)", opc:false, itens:[
    ["a1","V","Barramento de equipotencialização principal (BEP) instalado e acessível"],
    ["a2","V","Caixa de inspeção do aterramento com haste e conexão visíveis"],
    ["a3","V","Condutor de proteção presente nos circuitos e tomadas amostrados"]]},
  {id:"7", t:"SPDA (visual)", opc:true, pergunta:"A obra possui SPDA?", itens:[
    ["d1","V","Captação aparente conforme projeto (método e posição)"],
    ["d2","V","Descidas em quantidade conforme projeto (mínimo duas), com conector de ensaio"],
    ["d3","V","Material e seção aparente dos condutores conforme projeto (cobre ≥ 35 mm² na captação e descidas)"],
    ["d4","V","Estruturas metálicas da cobertura e da quadra interligadas à captação"],
    ["d5","V","Fixações e conexões sem corrosão, afrouxamento ou rompimento"]]},
  {id:"8", t:"Sistema fotovoltaico", opc:true, pergunta:"A obra possui sistema fotovoltaico?", itens:[
    ["f1","V","Módulos e inversor conforme projeto (dados de placa anotados)"],
    ["f2","V","Caixas de proteção CC e CA com seccionamento e DPS"],
    ["f3","V","Estruturas metálicas aterradas e placa de geração própria no padrão de entrada"],
    ["f4","T","String box, inversor e conexões sem pontos quentes"]]}
];
const METODO = {V:"Visual", T:"Termovisor", A:"Alicate"};
const NAO_REALIZADOS = [
  "Continuidade dos condutores de proteção e das ligações equipotenciais",
  "Resistência de isolamento",
  "Ensaio de dispositivos DR com instrumento (corrente e tempo de atuação)",
  "Verificação do seccionamento automático (impedância do percurso da corrente de falta)",
  "Polaridade e sequência de fases com instrumento",
  "Medição de tensão e qualidade de energia",
  "Resistência de aterramento",
  "Continuidade elétrica do SPDA e das armaduras"
];
const ESCOPO_TXT = "Vistoria in loco de caráter visual, complementada por medições pontuais de corrente elétrica com alicate amperímetro e por inspeção termográfica com câmera termovisora. Não foram realizados ensaios elétricos com instrumentos específicos, em especial: " +
  NAO_REALIZADOS.map(s=>s.charAt(0).toLowerCase()+s.slice(1)).join("; ") +
  ". Esses ensaios integram a verificação final prevista na seção 7 da ABNT NBR 5410:2004 e na ABNT NBR 5419:2015 e permanecem sob responsabilidade do responsável técnico da executora, a serem comprovados por laudo acompanhado de ART. As medições de corrente e temperatura refletem as condições de carga no momento da vistoria e não representam a demanda máxima da instalação. Esta vistoria não substitui o laudo técnico das instalações elétricas.";
const TERMO_CRIT = "Critério de severidade térmica: ANSI/NETA MTS, Tabela 100.18, por diferença de temperatura (ΔT) em relação a componente similar sob carga similar ou em relação à temperatura do ar ambiente. O critério é considerado válido com carga igual ou superior a 40% da nominal; abaixo disso a anomalia pode estar subestimada.";


const idbGet=(st,k)=>idbReq(st,"readonly",s=>s.get(k));
const idbPut=(st,v)=>idbReq(st,"readwrite",s=>s.put(v));
const idbDel=(st,k)=>idbReq(st,"readwrite",s=>s.delete(k));
const idbAll=st=>idbReq(st,"readonly",s=>s.getAll());

function uid8(){ return Math.random().toString(36).slice(2,10); }
function hojeISO(){ const d=new Date(); const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function novaVistoria(cfg){
  return { id:"v-"+Date.now().toString(36)+uid8().slice(0,4), createdAt:Date.now(), updatedAt:Date.now(),
    ident:{convenio:"",processo:"",municipio:"",escola:"",objeto:"",executora:"",rt:"",art:"",data:hojeISO(),horaIni:"",horaFim:"",
      fiscal:(cfg&&cfg.fiscal)||"Marcelo Jose Paris",cargo:(cfg&&cfg.cargo)||"Engenheiro Eletricista – Fiscal de Convênio SEDUC-MT (CIPI-SNP)",acompanhantes:"",clima:"",tAmb:"",funcionamento:"",etapaObra:""},
    instr:{alicate:{modelo:"",serie:"",calib:""}, termo:{modelo:"",serie:"",calib:"",emiss:"0,95",faixa:""}, obsLimit:""},
    aplica:{"2":false,"7":true,"8":false}, local:{endereco:"",coords:"",lat:null,lon:null,fonte:""}, carimbo:true, check:{}, correntes:[], termo:[], fotosGerais:[], notas:[], quadros:[{id:"qg",nome:""}], pend:{},
    cfg:{deseq:10}, rel:{texto:"",geradoEm:0,fonte:""} };
}
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,val){ const ks=p.split("."); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=val; }
function n(v){ if(v===""||v==null) return null; const x=parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; }
function fmt(x,d){ if(x==null) return "–"; return x.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function maskConv(s){ const d=String(s).replace(/\D/g,"").slice(0,8); return d.length>4? d.slice(0,4)+"-"+d.slice(4) : d; }
function dataBR(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function titulo(v){ const i=v.ident; const p=[]; if(i.convenio) p.push("Conv. "+i.convenio); if(i.escola) p.push(i.escola); if(i.municipio) p.push(i.municipio); return p.join(" · ")||"Nova vistoria"; }
function calcCorrente(r, limDeseq){
  const fases=[n(r.ia),n(r.ib),n(r.ic)].filter(x=>x!=null);
  const imax = fases.length? Math.max(...fases) : null;
  const inD = n(r.disjIn), iz=n(r.iz), ineu=n(r.ineutro);
  const pctIn = (imax!=null && inD)? imax/inD*100 : null;
  let deseq=null;
  if(fases.length===3){ const m=(fases[0]+fases[1]+fases[2])/3; if(m>0) deseq=(imax-m)/m*100; }
  const flags=[];
  if(pctIn!=null && pctIn>100) flags.push({k:"in",sev:"crit",txt:"Corrente acima da nominal do disjuntor ("+fmt(pctIn,0)+"% de In)"});
  if(iz && imax!=null && imax>iz) flags.push({k:"iz",sev:"crit",txt:"Corrente acima da capacidade de condução do cabo informada (Iz = "+fmt(iz,0)+" A)"});
  if(deseq!=null && deseq>limDeseq) flags.push({k:"deseq",sev:"warn",txt:"Desequilíbrio entre fases de "+fmt(deseq,1)+"% (limite de atenção adotado: "+limDeseq+"%)"});
  if(ineu!=null && imax!=null && fases.length>=2 && ineu>imax) flags.push({k:"neu",sev:"warn",txt:"Corrente no neutro maior que nas fases: investigar desequilíbrio ou harmônicos"});
  return {imax,pctIn,deseq,flags};
}
function calcTermo(r){
  const tm=n(r.tmax), tr=n(r.tref);
  const iMed=n(r.iMed), iNom=n(r.iNom);
  const carga = (iMed!=null && iNom)? iMed/iNom*100 : n(r.cargaPct);
  if(tm==null||tr==null) return {dt:null,sev:-1,txt:"Informe as temperaturas",acao:"",carga};
  const dt=tm-tr; let sev=0, txt="Sem anomalia relevante", acao="Nenhuma ação";
  if(r.refTipo==="ambiente"){
    if(dt>40){sev=4;txt="Discrepância grave";acao="Reparar imediatamente";}
    else if(dt>20){sev=3;txt="Deficiência";acao="Monitorar até a correção";}
    else if(dt>10){sev=2;txt="Provável deficiência";acao="Reparar quando possível";}
    else if(dt>=1){sev=1;txt="Possível deficiência";acao="Investigar";}
  } else {
    if(dt>15){sev=4;txt="Discrepância grave";acao="Reparar imediatamente";}
    else if(dt>3){sev=2;txt="Provável deficiência";acao="Reparar quando possível";}
    else if(dt>=1){sev=1;txt="Possível deficiência";acao="Investigar";}
  }
  return {dt,sev,txt,acao,carga,baixaCarga:(carga!=null && carga<40)};
}
function itensAtivos(v){ const out=[]; ETAPAS.forEach(e=>{ if(e.opc && !v.aplica[e.id]) return; itensDaEtapa(v,e).forEach(x=>out.push(Object.assign({e,st:v.check[x.id]||{}},x))); }); return out; }
function pendencias(v){
  const L=[];
  itensAtivos(v).forEach(x=>{ if(x.st.s==="NC") L.push({key:"chk:"+x.id, origem:"Inspeção – etapa "+x.e.id+(x.qn?" – "+x.qn:""), desc:(x.qn?x.base.toUpperCase()+" ("+x.qn+"): ":"")+x.t+(x.st.obs? " — "+x.st.obs:""), sug:"Moderada"}); });
  v.correntes.forEach(r=>{ const c=calcCorrente(r,v.cfg.deseq); c.flags.forEach(f=>L.push({key:"cor:"+r.id+":"+f.k, origem:"Correntes – "+(r.quadro||"quadro")+" / "+(r.circuito||"circuito"), desc:f.txt, sug:f.sev==="crit"?"Grave":"Moderada"})); });
  v.termo.forEach(r=>{ const c=calcTermo(r); if(c.sev>=2) L.push({key:"ter:"+r.id, origem:"Termografia – "+(r.local||"ponto"), desc:(r.componente||"Componente")+": ΔT = "+fmt(c.dt,1)+" °C ("+(r.refTipo==="ambiente"?"vs. ambiente":"vs. similar")+") – "+c.txt, sug:c.sev>=3?"Grave":"Moderada"}); });
  return L.map(p=>{ const s=v.pend[p.key]||{}; return Object.assign(p,{classe:s.classe||p.sug, prov:s.prov||"", prazo:s.prazo||""}); });
}
function resumo(v){
  const it=itensAtivos(v); const feitos=it.filter(x=>x.st.s).length;
  const nc=it.filter(x=>x.st.s==="NC").length;
  let cor=0; v.correntes.forEach(r=>cor+=calcCorrente(r,v.cfg.deseq).flags.length);
  let ter=0; v.termo.forEach(r=>{ if(calcTermo(r).sev>=2) ter++; });
  return {total:it.length,feitos,nc,cor,ter};
}
function fotoURL(f){ if(!S.urls[f.id]) carregarURL(f.id); return S.urls[f.id] || ""; }
async function carregarURL(id){ if(S.urls[id]!==undefined) return; S.urls[id]=""; try{ const r=await idbGet("fotos",id); const b=blobDe(r); if(b){ S.urls[id]=URL.createObjectURL(b); document.querySelectorAll(`img[data-fid="${id}"]`).forEach(im=>im.src=S.urls[id]); } }catch(e){} }
async function reduzirImagem(file, max, linhas, modo){
  const bmp = await abrirImagem(file); const bw=bmp.width||bmp.naturalWidth, bh=bmp.height||bmp.naturalHeight;
  const sc = Math.min(1, max/Math.max(bw,bh));
  const w=Math.round(bw*sc), h=Math.round(bh*sc);
  const tem = linhas&&linhas.length; const faixa = tem && modo==="faixa";
  let fs=0, lh=0, pad=0, sh=0;
  if(faixa){ fs=Math.max(14,Math.round(w*0.026)); lh=Math.round(fs*1.35); pad=Math.round(fs*0.7); sh=pad*2+lh*linhas.length; }
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h+sh; const g=cv.getContext("2d");
  g.imageSmoothingEnabled=true; try{ g.imageSmoothingQuality="high"; }catch(e){}
  g.drawImage(bmp,0,0,w,h);

    const c=its.filter(x=>x.s==="C").length, nc=its.filter(x=>x.s==="NC"), nv=its.filter(x=>!x.s||x.s==="NV").length;
    P("Etapa "+e.id+" – "+e.t+(e.id==="3"?" ("+(v.quadros||[]).map((q,i)=>nomeQd(q,i)).join("; ")+")":"")+": "+c+" conforme(s), "+nc.length+" não conforme(s), "+nv+" não verificado(s).");
    nc.forEach(x=>P("- "+codItem(x.id,v)+" não conforme: "+x.tx+(x.obs?". "+x.obs:"")+fr("chk:"+x.id)));
    its.filter(x=>x.s==="C"&&x.obs).forEach(x=>P("- "+codItem(x.id,v)+": "+x.obs+fr("chk:"+x.id)));
  });
  if((v.notas||[]).length){ P("Registros de campo:"); v.notas.forEach((nt,k)=>P("- Registro "+(k+1)+" ("+dtBR(new Date(nt.t)).slice(0,16)+"): "+(nt.txt||"sem anotação")+fr("nota:"+nt.id))); }
  { const au=todosAudios(v).filter(x=>x.a.txt); if(au.length){ P("Relatos registrados em campo:"); au.forEach(x=>P("- "+x.rot+": "+x.a.txt)); } }
  H("6. MEDIÇÕES DE CORRENTE");
  if(!v.correntes.length) P("Não foram registradas medições de corrente.");
  else { P(v.correntes.length+" circuito(s) medido(s); valores no Anexo A."); v.correntes.forEach(r=>{ const c=calcCorrente(r,v.cfg.deseq); if(c.flags.length) P("- "+(r.quadro||"")+" / "+(r.circuito||"")+": "+c.flags.map(f=>f.txt).join("; ")+"."); }); if(!v.correntes.some(r=>calcCorrente(r,v.cfg.deseq).flags.length)) P("Nenhuma corrente acima da nominal dos disjuntores e nenhum desequilíbrio acima do limite de atenção de "+v.cfg.deseq+"%."); }
  H("7. INSPEÇÃO TERMOGRÁFICA");
  if(!v.termo.length) P("Não foram registrados pontos termográficos.");
  else { P(v.termo.length+" ponto(s) inspecionado(s); valores no Anexo B."); v.termo.forEach(r=>{ const c=calcTermo(r); if(c.sev>=1) P("- "+(r.local||"")+" / "+(r.componente||"")+": ΔT "+fmt(c.dt,1)+" °C ("+(r.refTipo==="ambiente"?"vs. ambiente":"vs. similar")+"), "+c.txt.toLowerCase()+"; "+c.acao.toLowerCase()+"."+(c.baixaCarga||c.carga==null?" Carga abaixo de 40% ou não informada: severidade pode estar subestimada.":"")+fr("ter:"+r.id)); }); }
  H("8. PENDÊNCIAS E PROVIDÊNCIAS");
  const pend=pendencias(v);
  if(!pend.length) P("Não foram identificadas pendências no escopo desta vistoria.");
  ["Grave","Moderada","Documental"].forEach(cl=>{ const x=pend.filter(p=>p.classe===cl); if(!x.length) return; P(cl+":"); x.forEach(p=>P("- "+p.desc+(p.prov?". Providência: "+p.prov:"")+(p.prazo?". Prazo: "+p.prazo+" dias":"")+".")); });
  H("9. CONCLUSÃO");
  const g=pend.filter(p=>p.classe==="Grave").length;

     : "Não foram constatadas pendências graves no escopo desta vistoria.");
  P("Os ensaios da seção 7 da ABNT NBR 5410:2004 e, quando houver SPDA, os da ABNT NBR 5419:2015 devem ser comprovados por laudo do responsável técnico da executora, com ART.");
  return L.join("\n").trim();
}

    v.termo.map(r=>{ const c=calcTermo(r); return [r.local,r.componente,r.tmax,r.tref,r.refTipo==="ambiente"?"Ambiente":"Similar",c.dt!=null?fmt(c.dt,1):"–",c.carga!=null?fmt(c.carga,0):"n.i.",c.txt,c.acao]; })));
  else kids.push(p("Sem pontos registrados."));

  let k=0; out.forEach(o=>{ o.num=++k; o.cap+=metaTxt(o.f); }); return out;
}
function colocarFoto(tgt,f){
  const v=S.v; const [k,a,b]=tgt.split(":");
  if(k==="g") v.fotosGerais.push(f);
  else if(k==="c"){ const st=v.check[a]||(v.check[a]={}); (st.fotos||(st.fotos=[])).push(f); }
  else if(k==="t"){ const r=v.termo[+a]; if(b==="ir") r.fotoIR=f; else r.fotoVis=f; }
  else if(k==="n"){ const nt=v.notas.find(x=>x.id===a); if(nt) (nt.fotos||(nt.fotos=[])).push(f); }
}
function fotoPorRef(pref){ const v=S.v; const [k,a,b]=pref.split(":");
  try{ if(k==="g") return v.fotosGerais[+a]; if(k==="c") return v.check[a].fotos[+b]; if(k==="n") return v.notas.find(x=>x.id===a).fotos[+b]; if(k==="t") return b==="ir"? v.termo[+a].fotoIR : v.termo[+a].fotoVis; }catch(e){} return null; }
function removerFoto(pref){
  const v=S.v; const [k,a,b]=pref.split(":"); const f=fotoPorRef(pref);
  if(f&&f.id&&S.idb) idbDel("fotos",f.id).catch(()=>{});
  if(k==="g") v.fotosGerais.splice(+a,1);
  else if(k==="c") v.check[a].fotos.splice(+b,1);
  else if(k==="n"){ const nt=v.notas.find(x=>x.id===a); if(nt) nt.fotos.splice(+b,1); }
  else if(k==="t"){ const r=v.termo[+a]; if(b==="ir") delete r.fotoIR; else delete r.fotoVis; }
}

const COR_ET={"1":{local:"Padrão de entrada", circ:"Disjuntor geral", titulo:"Correntes na entrada", lead:"Meça fases e neutro na saída do disjuntor geral. O app compara com a In do disjuntor e a Iz do cabo e calcula o desequilíbrio."}};
function etDe(r){ return r&&r.et&&COR_ET[r.et]? r.et : ""; }
function qdDe(r){ return r&&r.qd? (S.v.quadros||[]).find(q=>q.id===r.qd)||null : null; }
function vincularMedicoes(v){ (v.correntes||[]).forEach(r=>{ if(r.qd && !(v.quadros||[]).some(q=>q.id===r.qd)) delete r.qd;
  if(!r.qd && !r.et && r.quadro){ const k=String(r.quadro).trim().toLowerCase(); const q=(v.quadros||[]).find(q=>String(q.nome||"").trim().toLowerCase()===k); if(q) r.qd=q.id; } }); }
function cardCor(r,i){ const v=S.v; const c=calcCorrente(r,v.cfg.deseq); const sv=sevCor(c); const open=S.openCor===r.id; const noQd=!!qdDe(r)||!!etDe(r);
    const num=(k,l)=>`<label class="f num"><span>${l}</span><input type="text" inputmode="decimal" enterkeyhint="next" data-cor="${i}" data-k="${k}" value="${esc(r[k]??"")}" autocomplete="off"></label>`;

      <div class="mc-b">
        ${noQd? circ : `<div class="g2"><label class="f"><span>Local / quadro</span><input type="text" enterkeyhint="next" data-cor="${i}" data-k="quadro" value="${esc(r.quadro??"")}" placeholder="Padrão de entrada" autocomplete="off" list="dlQd"></label>${circ}</div>`}
        <div class="g4">${num("ia","Fase A (A)")}${num("ib","Fase B (A)")}${num("ic","Fase C (A)")}${num("ineutro","Neutro (A)")}</div>

function sevTer(c){ return c.sev<0?"": c.sev===0?"ok": c.sev<=2?"warn":"crit"; }
function pillTer(c){ return c.sev<0?"": `<span class="pill ${sevTer(c)}">${esc(c.txt)}</span>`; }
const COMPONENTES=["Disjuntor geral","Disjuntor","Barramento","Borne / conexão","Cabo","Fusível","Contator","Transformador"];
function quadrosConhecidos(){ const v=S.v; return [...new Set([...(v.quadros||[]).map(q=>String(q.nome||"").trim()),...v.correntes.map(r=>r.quadro),...v.termo.map(r=>r.local)].filter(Boolean))].slice(0,8); }

      : `<label class="slot">${ICON.cam}<span>${lbl}</span><input type="file" accept="image/*" capture="environment" data-addph="t:${i}:${k}"></label>`; };

    const chips=(lista,k)=>lista.length?`<div class="chips">${lista.map(x=>`<button type="button" class="chip-s ${r[k]===x?"on":""}" data-act="terChip" data-i="${i}" data-k="${k}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:"";

      <button class="mc-h" type="button" data-act="toggleTer" data-id="${esc(r.id)}"><span class="l1"><span id="terT_${i}">${esc(r.local||"Ponto "+(i+1))}${r.componente?" · "+esc(r.componente):""}</span><span id="terPill_${i}">${pillTer(c)}</span></span>

        <div class="passo"><b>1</b> Fotografe a tela da câmera térmica e o mesmo ponto em foto comum</div>

        ${chips(COMPONENTES,"componente")}

        <p class="lead">${amb?"Use quando não há peça igual para comparar (ex.: cabo único, transformador). Leia a temperatura do ar perto do quadro.":"Preferível: compare com a peça igual que está fria. Ex.: borne da fase C a 58 °C e borne da fase A a 36 °C."}</p>
        <div class="resultado" id="terRes_${i}">${resTer(c,r)}</div>

function resumoTer(r,c){ const p=[]; if(r.tmax) p.push("Tmáx "+r.tmax+" °C"); if(c.dt!=null) p.push("ΔT "+fmt(c.dt,1)+" °C "+(r.refTipo==="ambiente"?"(amb.)":"(sim.)")); if(c.carga!=null) p.push("carga "+fmt(c.carga,0)+"%");
  const nf=(r.fotoIR?1:0)+(r.fotoVis?1:0); if(nf) p.push(nf+" foto"+(nf>1?"s":"")); if(r.audio&&r.audio.id) p.push("áudio "+fmtDur(r.audio.dur)); return esc(p.join(" · ")||"toque para preencher"); }
function resTer(c,r){
  if(c.sev<0) return `<div class="res-vazio">Preencha as duas temperaturas para ver a gravidade.</div>`;
  const tom=sevTer(c)||"na"; const ref=r&&r.refTipo==="ambiente"?"o ar":"a outra fase";
  return `<div class="res-box ${tom}"><div class="res-dt mono">ΔT ${fmt(c.dt,1)} °C</div><div><b>${esc(c.sev===0?"Normal":c.txt)}</b><br><span>${esc(c.sev===0?"Diferença menor que 1 °C em relação a "+ref+".":c.acao+". Ponto "+fmt(c.dt,1)+" °C mais quente que "+ref+".")}</span></div></div>`
   + (c.carga!=null? `<div class="status">Carga no momento: ${fmt(c.carga,0)}% da nominal${c.baixaCarga?" – abaixo de 40%: a gravidade real pode ser maior.":"."}</div>` : `<div class="status">Sem a carga informada (passo 4), o relatório indica que a gravidade pode estar subestimada.</div>`);
}
function atualizarTer(i){ const r=S.v.termo[i]; if(!r) return; const c=calcTermo(r);
  const set=(id,h)=>{ const el=document.getElementById(id); if(el) el.innerHTML=h; };

  atualizarChrome(); }

/* ============================== Visualizador de fotos ============================== */
const VW={tok:0, el:document.getElementById("vw"), img:document.getElementById("vwImg"), stage:document.getElementById("vwStage"), list:[], i:0, s:1, x:0, y:0, ptr:new Map(), start:null, lastTap:0, swipeX:0};
function abrirVisualizador(pref){
  VW.list=listaFotos(S.v); VW.i=Math.max(0,VW.list.findIndex(o=>o.pref===pref)); if(!VW.list.length) return;
  VW.el.hidden=false; document.body.style.overflow="hidden"; try{ history.pushState({vw:1},""); }catch(e){}
  mostrarFoto();
}
function fecharVisualizador(viaHist){ if(VW.el.hidden) return; VW.el.hidden=true; document.body.style.overflow=""; if(!viaHist){ try{ if(history.state&&history.state.vw) history.back(); }catch(e){} } render(true); }
function mostrarFoto(){
  const o=VW.list[VW.i]; if(!o){ fecharVisualizador(); return; }
  VW.s=1; VW.x=0; VW.y=0; aplicarZoom();
  const u=fotoURL(o.f); VW.img.src=u||""; if(!u) carregarURL(o.f.id).then(()=>{ if(VW.list[VW.i]===o) VW.img.src=fotoURL(o.f); });
  document.getElementById("vwCount").textContent="Foto "+o.num+" de "+VW.list.length;
  document.getElementById("vwCap").textContent=o.cap.split(" – ").slice(0,2).join(" – ");
  const m=o.f.meta; document.getElementById("vwMeta").textContent=m? [m.dt?dtBR(new Date(m.dt)):"", m.lat!=null?fmtCoord(m.lat,m.lon)+" ("+m.gpsFonte+")":"sem coordenadas"].filter(Boolean).join(" · ") : "";
  document.getElementById("vwLeg").value=o.f.leg||"";
  carregarAlta(o,++VW.tok);
  renderAudViewer(o);
  document.getElementById("vwPrev").disabled=VW.i===0; document.getElementById("vwNext").disabled=VW.i===VW.list.length-1;
}
async function carregarAlta(o,tk){
  const st=document.getElementById("vwQual"), link=document.getElementById("vwDrive"); st.textContent=""; link.hidden=true;
  let r=null; try{ r=await idbGet("fotos",o.f.id); }catch(e){}
  if(VW.tok!==tk) return;
  const did=(r&&r.driveId)||((S.v.drive&&S.v.drive.fotos)||{})[o.f.id];
  if(did){ link.href="https://drive.google.com/file/d/"+did+"/view"; link.hidden=false; }
  if(!r || r.buf || r.blob || !r.prev) return;
  if(!navigator.onLine){ st.textContent="Prévia reduzida (sem internet). Original no Drive."; return; }
  if(!tokenOk()){ st.textContent="Prévia reduzida. Original no Drive."; return; }
  st.textContent="Carregando o original do Drive…";
  try{ const b=await fotoAlta(o.f); if(VW.tok!==tk) return; if(b){ VW.img.src=URL.createObjectURL(b); st.textContent="Original do Drive"; } else st.textContent="Prévia reduzida. Original no Drive."; }
  catch(e){ if(VW.tok===tk) st.textContent="Não foi possível baixar o original; mostrando a prévia."; }
}
function aplicarZoom(){ VW.img.style.transform=`translate(${VW.x}px,${VW.y}px) scale(${VW.s})`; }
function limitarPan(){ const r=VW.img.getBoundingClientRect(), st=VW.stage.getBoundingClientRect(); const w=r.width/VW.s, h=r.height/VW.s;
  const mx=Math.max(0,(w*VW.s-st.width)/2), my=Math.max(0,(h*VW.s-st.height)/2); VW.x=Math.max(-mx,Math.min(mx,VW.x)); VW.y=Math.max(-my,Math.min(my,VW.y)); }
function zoomEm(ns,cx,cy){ const st=VW.stage.getBoundingClientRect(); const ox=cx-(st.left+st.width/2), oy=cy-(st.top+st.height/2);
  ns=Math.max(1,Math.min(6,ns)); VW.x=ox-(ox-VW.x)*(ns/VW.s); VW.y=oy-(oy-VW.y)*(ns/VW.s); VW.s=ns; if(VW.s===1){VW.x=0;VW.y=0;} limitarPan(); aplicarZoom(); }
VW.stage.addEventListener("pointerdown",e=>{ VW.stage.setPointerCapture(e.pointerId); VW.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(VW.ptr.size===2){ const [a,b]=[...VW.ptr.values()]; VW.start={d:Math.hypot(a.x-b.x,a.y-b.y), s:VW.s}; }
  else if(VW.ptr.size===1){ VW.start={px:e.clientX,py:e.clientY,x:VW.x,y:VW.y,t:Date.now()}; VW.swipeX=0; } });
VW.stage.addEventListener("pointermove",e=>{ if(!VW.ptr.has(e.pointerId)) return; VW.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(VW.ptr.size===2 && VW.start && VW.start.d){ const [a,b]=[...VW.ptr.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomEm(VW.start.s*d/VW.start.d,(a.x+b.x)/2,(a.y+b.y)/2); }
  else if(VW.ptr.size===1 && VW.start && VW.start.px!=null){ const dx=e.clientX-VW.start.px, dy=e.clientY-VW.start.py;
    if(VW.s>1){ VW.x=VW.start.x+dx; VW.y=VW.start.y+dy; limitarPan(); aplicarZoom(); } else { VW.swipeX=dx; VW.img.style.transform=`translateX(${dx}px)`; } } });
function fimPtr(e){ if(!VW.ptr.has(e.pointerId)) return; VW.ptr.delete(e.pointerId);
  if(VW.ptr.size===0 && VW.start && VW.start.px!=null){
    if(VW.s===1){ const dx=VW.swipeX; VW.img.style.transform=""; if(dx<-60 && VW.i<VW.list.length-1){ VW.i++; mostrarFoto(); } else if(dx>60 && VW.i>0){ VW.i--; mostrarFoto(); } }
    const now=Date.now(); const moved=Math.abs(e.clientX-VW.start.px)+Math.abs(e.clientY-VW.start.py);

async function driveFetch(url,opts={}){

  if(r.ok) return r.status===204? null : r.json();

  const err=(j&&j.error)||{}; const motivo=(err.errors&&err.errors[0]&&err.errors[0].reason)||err.status||"";

  if(r.status===404){ const e=new Error("item não encontrado no Drive"); e.nf=true; throw e; }

          const j=await enviarArquivo({name:nome, parents:[v.drive.pasta], description:"Relato em áudio – "+x.rot+(x.a.txt?" – Transcrição: "+x.a.txt:"")}, b.type?b:new Blob([b],{type:"audio/wav"}));

function rotuloAudio(ref){ const v=S.v; const [k,a]=String(ref).split(":");
  if(k==="cor"){ const r=v.correntes[+a]||{}; return "Medição – "+(r.quadro||"quadro")+" / "+(r.circuito||"circuito "+(+a+1)); }
  if(k==="ter"){ const r=v.termo[+a]||{}; return "Termografia – "+(r.local||"ponto "+(+a+1))+(r.componente?" / "+r.componente:""); }
  return rotulo(ref.split(":").slice(0,2).join(":")); }
/* todos os áudios de uma vistoria, com rótulo e número da foto quando houver */
function todosAudios(v){
  const out=[]; const fotos=listaFotos(v);
  fotos.forEach(o=>{ if(o.f.audio&&o.f.audio.id) out.push({ref:o.pref, a:o.f.audio, rot:"Foto "+o.num+" – "+o.cap.split(" – ").slice(0,2).join(" – "), num:o.num, alvo:o}); });
  v.correntes.forEach((r,i)=>{ if(r.audio&&r.audio.id) out.push({ref:"cor:"+i, a:r.audio, rot:"Medição – "+(r.quadro||"quadro")+" / "+(r.circuito||"circuito "+(i+1)), holder:r, tipo:"cor"}); });
  v.termo.forEach((r,i)=>{ if(r.audio&&r.audio.id) out.push({ref:"ter:"+i, a:r.audio, rot:"Termografia – "+(r.local||"ponto "+(i+1))+(r.componente?" / "+r.componente:""), holder:r, tipo:"ter"}); });
  return out;
}
function audiosPendentesDrive(v){ return todosAudios(v).filter(x=>!x.a.driveId); }
function audBox(ref,a){
  if(!a||!a.id) return "";
  const st = a.txt? `<span class="pill ok">transcrito${a.fonte?" ("+esc(a.fonte)+")":""}</span>` : a.st==="erro"? `<span class="pill crit">transcrição falhou</span>` : `<span class="pill warn">transcrição na fila</span>`;
  return `<div class="audbox" data-audbox="${esc(ref)}"><div class="h"><span>Relato em áudio · ${fmtDur(a.dur)}</span>${st}</div>
    <audio controls preload="none" data-aud="${esc(a.id)}"></audio>
    <textarea data-audtxt="${esc(ref)}" rows="2" placeholder="${a.txt?"":"A transcrição aparece aqui; você pode digitar ou corrigir."}">${esc(a.txt||"")}</textarea>
    <div class="row">${!a.txt?`<button type="button" class="btn sm" data-act="sttUm" data-ref="${esc(ref)}">Transcrever agora</button>`:""}<button type="button" class="btn sm ghost danger" data-act="delAud" data-ref="${esc(ref)}">Excluir áudio</button></div></div>`;
}
async function ligarAudios(raiz){ for(const el of (raiz||document).querySelectorAll("audio[data-aud]")){ if(el.src) continue; const id=el.dataset.aud;
  try{ const r=await idbGet("fotos",id); const b=blobDe(r)||(S.memFotos&&S.memFotos[id]); if(b) el.src=URL.createObjectURL(b); }catch(e){} } }

/* ---------- gravação ---------- */
async function iniciarGravacao(ref){
  if(AUD.stream) return;
  if(!holderPorRef(ref)){ toastSave("Tire a foto primeiro: o áudio fica vinculado a ela.",true); return; }
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ toastSave("Este navegador não permite gravar áudio.",true); return; }
  try{ AUD.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ AUD.stream=null; toastSave(e&&e.name==="NotAllowedError"?"Microfone bloqueado: libere o microfone para este app nos ajustes do celular.":"Não foi possível usar o microfone: "+msgErro(e),true); return; }
  const AC=window.AudioContext||window.webkitAudioContext; AUD.ctx=new AC(); try{ await AUD.ctx.resume(); }catch(e){}
  AUD.rate=AUD.ctx.sampleRate; AUD.chunks=[];
  const src=AUD.ctx.createMediaStreamSource(AUD.stream);
  AUD.proc=AUD.ctx.createScriptProcessor(4096,1,1);
  AUD.proc.onaudioprocess=e=>{ AUD.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(AUD.proc); AUD.proc.connect(AUD.ctx.destination);
  AUD.alvo=ref; AUD.t0=Date.now(); AUD.txtFinal=""; AUD.txtParcial=""; AUD.srOk=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR && navigator.onLine){ try{ const sr=new SR(); sr.lang="pt-BR"; sr.continuous=true; sr.interimResults=true;
      let base="";
      sr.onresult=ev=>{ let fin="",par=""; for(let i=0;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) fin+=r[0].transcript+" "; else par+=r[0].transcript; } AUD.txtFinal=(base+" "+fin).trim(); AUD.txtParcial=par; AUD.srOk=true; atualizarGravacao(); };
      let reinicios=0, falhou=false;
      sr.onerror=ev=>{ falhou=true; if(ev&&(ev.error==="not-allowed"||ev.error==="service-not-allowed"||ev.error==="audio-capture"||ev.error==="network")) { AUD.sr=null; atualizarGravacao(); } };
      sr.onend=()=>{ if(AUD.stream && AUD.sr===sr && reinicios<30 && !(falhou&&!AUD.srOk)){ reinicios++; base=AUD.txtFinal; falhou=false; setTimeout(()=>{ try{ if(AUD.sr===sr) sr.start(); }catch(e){} },150); } else if(AUD.sr===sr){ AUD.sr=null; atualizarGravacao(); } };
      AUD.sr=sr; sr.start(); }catch(e){ AUD.sr=null; } }
  else AUD.sr=null;
  document.getElementById("recAlvo").textContent=rotuloAudio(ref);
  document.getElementById("recSheet").hidden=false; atualizarGravacao(); vib();
  AUD.timer=setInterval(()=>{ atualizarGravacao(); if((Date.now()-AUD.t0)/1000>=AUD.max) pararGravacao(false); },250);
}
function atualizarGravacao(){
  const s=(Date.now()-AUD.t0)/1000; document.getElementById("recTempo").textContent=fmtDur(s);
  const el=document.getElementById("recTxt"); const t=(AUD.txtFinal+" "+AUD.txtParcial).trim();
  if(t) el.textContent=t;
  else el.textContent = AUD.sr? "Fale o problema identificado… a transcrição aparece aqui." : (navigator.onLine? "Transcrição na hora indisponível neste celular. O áudio é gravado e transcrito depois." : "Sem internet: o áudio é gravado agora e transcrito quando a conexão voltar.");
}
async function pararGravacao(cancelar){
  if(!AUD.stream) return;
  clearInterval(AUD.timer);
  const sr=AUD.sr; AUD.sr=null;
  if(sr){ try{ sr.stop(); }catch(e){} await new Promise(r=>setTimeout(r,800)); }
  try{ AUD.proc.disconnect(); }catch(e){}
  AUD.stream.getTracks().forEach(t=>t.stop()); try{ await AUD.ctx.close(); }catch(e){}
  const dur=(Date.now()-AUD.t0)/1000, chunks=AUD.chunks, rate=AUD.rate, ref=AUD.alvo, txt=(AUD.txtFinal+" "+AUD.txtParcial).trim();
  AUD.stream=null; AUD.chunks=[]; document.getElementById("recSheet").hidden=true;
  if(cancelar || dur<0.8){ toastSave(cancelar?"Gravação descartada":"Gravação muito curta"); return; }
  const wav=wavDe(chunks,rate,16000);
  const id="a-"+Date.now().toString(36)+uid8();
  try{ await idbPut("fotos",{id,buf:await wav.arrayBuffer(),type:"audio/wav",vid:S.v.id,criado:Date.now()}); }
  catch(e){ S.memFotos=S.memFotos||{}; S.memFotos[id]=wav; toastSave("Áudio mantido só enquanto o app estiver aberto: o navegador não deixou gravar no aparelho",true); }
  const h=holderPorRef(ref); if(!h) return;
  if(h.audio&&h.audio.id) idbDel("fotos",h.audio.id).catch(()=>{});
  h.audio={id, dur:Math.round(dur), txt:txt, fonte:txt?"celular, na hora":"", st:txt?"ok":"fila", em:Date.now()};
  if(txt) aplicarTranscricao(ref,txt);
  agendarSalvar(); agendarSync(2500); if(!txt) agendarTranscricao(1500);
  toastSave(txt?"Áudio salvo e transcrito":"Áudio salvo; transcrição na fila");
  if(!VW.el.hidden) mostrarFoto(); else render(true);
}
/* preenche a observação vazia com a transcrição (medição, ponto termográfico, item da inspeção, registro de campo) */
function aplicarTranscricao(ref,txt,v){
  v=v||S.v; const [k,a]=String(ref).split(":");
  if(k==="cor"){ const r=v.correntes[+a]; if(r&&!r.obs) r.obs=txt; }
  else if(k==="ter"){ const r=v.termo[+a]; if(r&&!r.obs) r.obs=txt; }
  else if(k==="c"){ const st=v.check[a]||(v.check[a]={}); if(!st.obs) st.obs=txt; }
  else if(k==="n"){ const nt=(v.notas||[]).find(x=>x.id===a); if(nt&&!nt.txt) nt.txt=txt; }
}
function wavDe(chunks,rate,alvo){
  let n=0; chunks.forEach(c=>n+=c.length); const pcm=new Float32Array(n); let o=0; chunks.forEach(c=>{ pcm.set(c,o); o+=c.length; });
  const fator=Math.max(1,rate/alvo), sr=rate<alvo?rate:alvo; const m=Math.floor(n/fator); const out=new Int16Array(m);
  for(let i=0;i<m;i++){ const ini=Math.floor(i*fator), fim=Math.min(n,Math.max(ini+1,Math.floor((i+1)*fator))); let s=0; for(let j=ini;j<fim;j++) s+=pcm[j]; let x=s/(fim-ini); x=Math.max(-1,Math.min(1,x)); out[i]=x<0? x*0x8000 : x*0x7FFF; }
  const buf=new ArrayBuffer(44+out.length*2); const dv=new DataView(buf); const w=(p,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(p+i,s.charCodeAt(i)); };
  w(0,"RIFF"); dv.setUint32(4,36+out.length*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,out.length*2,true);
  new Int16Array(buf,44).set(out); return new Blob([buf],{type:"audio/wav"});
}

/* ---------- fila de transcrição pelo Google Speech-to-Text ---------- */
let sttTimer=null, sttRodando=false;
function agendarTranscricao(ms){ clearTimeout(sttTimer); sttTimer=setTimeout(()=>transcreverFila(),ms==null?1500:ms); }
function transcricoesPendentes(){ const vs=S.list.includes(S.v)? S.list : [S.v,...S.list]; return vs.reduce((n,v)=>n+todosAudios(v).filter(x=>!x.a.txt).length,0); }
async function transcreverGoogle(a){
  const r=await idbGet("fotos",a.id).catch(()=>null); const b=blobDe(r)||(S.memFotos&&S.memFotos[a.id]); if(!b) throw new Error("áudio não encontrado no aparelho");
  const conteudo=(await b64(b)).split(",")[1];
  const cfg={encoding:"LINEAR16",sampleRateHertz:16000,languageCode:"pt-BR",enableAutomaticPunctuation:true};
  const key=encodeURIComponent(sttKey()); const longo=(a.dur||0)>55;
  let res=await fetch("https://speech.googleapis.com/v1/speech:"+(longo?"longrunningrecognize":"recognize")+"?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({config:cfg,audio:{content:conteudo}})});
  let j=await res.json().catch(()=>({})); if(!res.ok) throw erroSTT(res,j);
  if(longo){ const nome=j.name; let ok=false;
    for(let k=0;k<80;k++){ await new Promise(r=>setTimeout(r,3000)); const r2=await fetch("https://speech.googleapis.com/v1/operations/"+encodeURIComponent(nome)+"?key="+key); j=await r2.json().catch(()=>({})); if(!r2.ok) throw erroSTT(r2,j); if(j.done){ if(j.error) throw new Error(j.error.message||"falha na transcrição"); j=j.response||{}; ok=true; break; } }
    if(!ok) throw new Error("a transcrição demorou demais; tenta de novo depois"); }
  return (j.results||[]).map(x=>(x.alternatives&&x.alternatives[0]&&x.alternatives[0].transcript)||"").join(" ").replace(/\s+/g," ").trim();
}
function erroSTT(res,j){ const m=(j&&j.error&&j.error.message)||("erro "+res.status); const e=new Error(m);
  if(/billing/i.test(m)){ e.message="o faturamento não está ativado no projeto do Google Cloud"; e.parar=true; }
  else if(/has not been used|is disabled|SERVICE_DISABLED/i.test(m)){ e.message="a API Speech-to-Text não está ativada no projeto do Google Cloud"; e.parar=true; }
  else if(/API key not valid|API_KEY_INVALID/i.test(m)){ e.message="a chave da API de transcrição é inválida"; e.parar=true; }
  else if(/referer|referrer|blocked/i.test(m)){ e.message="a chave não permite este endereço (restrição de site da chave)"; e.parar=true; }
  else if(res.status===429){ e.message="limite de uso atingido; nova tentativa depois"; e.parar=true; }
  return e; }
async function transcreverFila(){
  if(sttRodando||!navigator.onLine||!sttKey()) return;
  sttRodando=true; S.sttErro="";
  try{ const vs=S.list.includes(S.v)? S.list : [S.v,...S.list];
    for(const v of vs){ let mud=false;
      for(const x of todosAudios(v)){ const a=x.a; if(a.txt) continue;
        try{ const t=await transcreverGoogle(a); a.txt=t; a.fonte="Google"; a.st=t?"ok":"vazio"; a.erro=""; if(t) aplicarTranscricao(x.ref,t,v); mud=true; }
        catch(e){ a.st="erro"; a.erro=msgErro(e); mud=true; if(e.parar){ S.sttErro=a.erro; if(v===S.v) agendarSalvar(); else await gravarVistoria(v); throw e; } } }
      if(mud){ if(v===S.v){ v.updatedAt=Date.now(); agendarSalvar(); } else { v.updatedAt=Date.now(); await gravarVistoria(v); } } }
  }catch(e){ S.sttErro=msgErro(e); }
  finally{ sttRodando=false; renderSeguro(); }
}
function renderSeguro(){ const a=document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && M.contains(a)) return; if(!VW.el.hidden){ mostrarFoto(); return; } if(document.getElementById("recSheet").hidden) render(true); }
async function transcreverUm(ref){
  const h=holderPorRef(ref); const a=h&&h.audio; if(!a) return;
  if(!navigator.onLine){ toastSave("Sem internet: a transcrição fica na fila.",true); return; }
  if(!sttKey()){ toastSave("Configure a chave de transcrição em Dados › Transcrição de áudio.",true); return; }
  toastSave("Transcrevendo…");
  try{ const t=await transcreverGoogle(a); a.txt=t; a.fonte="Google"; a.st=t?"ok":"vazio"; if(t) aplicarTranscricao(ref,t); agendarSalvar(); toastSave(t?"Transcrito":"Nenhuma fala reconhecida no áudio",!t); }
  catch(e){ a.st="erro"; a.erro=msgErro(e); agendarSalvar(); toastSave("Falha na transcrição: "+msgErro(e),true); }
  renderSeguro();
}
/* ---------- visualizador ---------- */
function renderAudViewer(o){
  const box=document.getElementById("vwAud"); const a=o.f.audio;
  if(!a||!a.id){ box.innerHTML=`<div class="row"><button type="button" data-mic="${esc(o.pref)}">● Gravar relato em áudio</button></div>`; return; }
  box.innerHTML=`<div class="st">Relato em áudio · ${fmtDur(a.dur)} · ${a.txt?"transcrito"+(a.fonte?" ("+esc(a.fonte)+")":""):(a.st==="erro"?"transcrição falhou: "+esc(a.erro||""):"transcrição na fila")}</div>
    <audio controls preload="none" data-aud="${esc(a.id)}"></audio>
    <textarea data-audtxt="${esc(o.pref)}" rows="2" placeholder="Transcrição (pode digitar ou corrigir)">${esc(a.txt||"")}</textarea>
    <div class="row">${!a.txt?`<button type="button" data-act="sttUm" data-ref="${esc(o.pref)}">Transcrever agora</button>`:""}<button type="button" data-mic="${esc(o.pref)}">Regravar</button><button type="button" data-act="delAud" data-ref="${esc(o.pref)}">Excluir áudio</button></div>`;
  ligarAudios(box);
}
/* ---------- configuração ---------- */
function rTranscricao(){
  const k=sttKey(); const pend=transcricoesPendentes();
  return `<details class="card"><summary>Transcrição de áudio <small>${k?"chave configurada":"sem chave"}${pend?" · "+pend+" na fila":""}</small></summary>
    <p class="lead">1) Na hora: o celular transcreve enquanto você fala, quando o reconhecimento de voz está disponível e há internet.<br>2) Depois: o que ficar sem texto é transcrito pelo Google Speech-to-Text quando houver internet. Precisa de uma chave de API do projeto do Google Cloud, guardada só neste aparelho.<br>3) Se ainda assim faltar, os áudios .wav vão para a pasta da vistoria no Drive e o Claude pode transcrever.</p>
    <label class="f" for="sttKey"><span>Chave da API Speech-to-Text</span><input id="sttKey" type="text" value="${esc(k)}" placeholder="AIza…" autocomplete="off" spellcheck="false"></label>
    <p class="lead">Para criar: no Google Cloud do projeto do fiscaliza-coipt, <a href="https://console.cloud.google.com/apis/library/speech.googleapis.com?project=419096828771" target="_blank" rel="noopener">ative a API Speech-to-Text</a> (pede faturamento ativado; há cota gratuita mensal) e <a href="https://console.cloud.google.com/apis/credentials?project=419096828771" target="_blank" rel="noopener">crie uma chave de API</a>, restrita à API Speech-to-Text e ao site marcelojoseparis.github.io/*.</p>
    <span class="status" id="sttSt">${S.sttErro?"Último erro: "+esc(S.sttErro):""}</span>
  </details>`;
}
window.addEventListener("online",()=>agendarTranscricao(1200));
setInterval(()=>{ if(navigator.onLine && sttKey() && transcricoesPendentes()) transcreverFila(); },120000);

/* ============================== Início ============================== */
(async function(){
  S.v=novaVistoria(); render();
  await initCaps();
  await carregar();
  if(!S.v.ident.convenio && !S.v.ident.escola) S.tab="dados";
  render(); atualizarRede();
  toastSave(S.store==="idb"?"Salvo no aparelho":"Sem armazenamento");
  try{ if(navigator.permissions){ const p=await navigator.permissions.query({name:"geolocation"}); if(p.state==="granted") iniciarGPS(); } }catch(e){}
  atualizarChipDrive(); if(autoLigado() && navigator.onLine){ carregarGIS().catch(()=>{}); agendarSync(2000); }
})();
